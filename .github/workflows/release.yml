name: Release

# Ao criar uma tag v* (ex: git tag v0.1.0 && git push --tags),
# roda os testes, gera o build e publica um .zip "abre e joga" no Release.
on:
  push:
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run fetch-cards
      - run: npm run build
      - name: Empacotar
        if: startsWith(github.ref, 'refs/tags/')
        run: cd dist && zip -r ../gwent-${{ github.ref_name }}.zip .
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: gwent-${{ github.ref_name }}.zip
