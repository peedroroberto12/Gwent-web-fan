[package]
name = "gwent-classico"
version = "0.1.0"
description = "Gwent Clássico — fan project gratuito do Gwent de The Witcher 3"
edition = "2021"

[lib]
name = "gwent_classico_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# executável pequeno
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
